services:
  db:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    env_file:
      - ./application/backend/.env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 1s
      timeout: 1s
      retries: 60
    command: ['postgres', '-c', 'log_statement=all']
    volumes:
      - ctrl-db:/var/lib/postgresql/data

  db-test:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    env_file:
      - ./application/backend/.env.test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 1s
      timeout: 1s
      retries: 60
    command: ['postgres', '-c', 'log_statement=all']

  backend-test:
    build:
      dockerfile: Dockerfile.backend
    env_file:
      - ./application/backend/.env.test
    ports:
      - '5001:5001'

  admin:
    image: adminer
    restart: always
    depends_on:
      - db
    ports:
      - 8080:8080
volumes:
  ctrl-db:
