version: '3'
services:
  db:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 1s
      timeout: 1s
      retries: 60
    volumes:
      - ./application/backend/database:/docker-entrypoint-initdb.d
    env_file: .env

  app:
    image: 'ctrl-next:latest'
    environment:
      POSTGRES_HOST: db

    ports:
      - '3000:3000'
      - '5000:5000'
