version: '3'
services:
  db:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    #env_file: application/backend/.env
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 1s
      timeout: 1s
      retries: 60
    command: ['postgres', '-c', 'log_statement=all']
