name: Build checks

on: [push]

jobs:
  build-checks:
    name: build checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3
      - name: Build Image
        run: make docker-build
      - name: Check Types
        run: docker run ctrl-next:latest yarn type-check
      - name: Format Code
        run: docker run ctrl-next:latest yarn format
      - name: Lint Code
        run: docker run ctrl-next:latest yarn lint
      - name: Run Unit Testing
        run: docker run ctrl-next:latest yarn test
  security-checks:
    uses: Garvan-Data-Science-Platform/reusable-ci-actions/.github/workflows/security-audit.yml@main
    secrets: inherit
