name: Test helm install

on:
  workflow_run:
    workflows: ['Build and Push']
    types: [completed]

jobs:
  helm-install:
    name: test helm install
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: start minikube
        id: minikube
        uses: medyagh/setup-minikube@latest

      - name: install helm
        id: helm
        uses: azure/setup-helm@v4.3.0

      - name: install from helm
        run: helm repo add jetstack https://charts.jetstack.io --force-update && helm dependency build .helm/ctrl && helm install --wait --set nginx-ingress.enabled=false --set userClient.image.tag=latest --set adminClient.image.tag=latest --set backend.image.tag=latest ctrl .helm/ctrl

      - name: test installation
        run: helm test ctrl --logs

      - name: print logs
        if: always()
        run: kubectl logs -l app=USERCLIENT && kubectl logs -l app=BACKEND && kubectl logs -l app=ADMINCLIENT

  helm-upgrade:
    name: test helm upgrade from previous version
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: start minikube
        id: minikube
        uses: medyagh/setup-minikube@latest

      - name: install helm
        id: helm
        uses: azure/setup-helm@v4.3.0

      - name: install previous version with helm
        run: helm repo add jetstack https://charts.jetstack.io --force-update && helm dependency build .helm/ctrl && helm install --wait --set nginx-ingress.enabled=false ctrl oci://australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl:1.0.0

      - name: seed
        run: kubectl exec deployment/backend -- yarn prisma:seed

      - name: upgrade
        run: helm dependency build .helm/ctrl && helm upgrade --wait --set nginx-ingress.enabled=false --set userClient.image.tag=latest --set adminClient.image.tag=latest --set backend.image.tag=latest ctrl .helm/ctrl

      - name: test installation
        run: helm test ctrl --logs

      - name: print logs
        if: always()
        run: kubectl logs -l app=USERCLIENT && kubectl logs -l app=BACKEND && kubectl logs -l app=ADMINCLIENT
