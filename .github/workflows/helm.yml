name: Test helm install

on:
  workflow_run:
    workflows: ['Build and Push']
    types: [completed]
  workflow_dispatch:

jobs:
  helm-install:
    name: test helm install
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          # Use the SHA of the commit that triggered the 'Build and Push' workflow
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: start minikube
        id: minikube
        uses: medyagh/setup-minikube@latest
        with:
          cpus: max
          memory: max

      - name: install helm
        id: helm
        uses: azure/setup-helm@v4.3.0

      - name: install from helm
        run: |
          helm repo add stakater https://stakater.github.io/stakater-charts --force-update
          helm dependency build .helm/ctrl
          helm install --wait --timeout 10m \
            --set nginx-ingress.enabled=false \
            --set userClient.image.tag=${{ github.event.workflow_run.head_sha || github.sha }} \
            --set adminClient.image.tag=${{ github.event.workflow_run.head_sha || github.sha }} \
            --set backend.image.tag=${{ github.event.workflow_run.head_sha || github.sha }} \
            ctrl .helm/ctrl

      - name: debug cluster on failure
        if: failure()
        run: |
          echo "=== POD STATUS ==="
          kubectl get pods -A
          echo "=== POD DESCRIPTIONS ==="
          kubectl describe pods
          echo "=== CLUSTER EVENTS ==="
          kubectl get events --sort-by='.metadata.creationTimestamp'

      - name: test installation
        run: helm test ctrl --logs

      - name: print logs
        if: always()
        run: kubectl logs -l app=USERCLIENT && kubectl logs -l app=BACKEND && kubectl logs -l app=ADMINCLIENT

  helm-upgrade:
    name: test helm upgrade from previous version
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          # Use the SHA of the commit that triggered the 'Build and Push' workflow
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: start minikube
        id: minikube
        uses: medyagh/setup-minikube@latest
        with:
          cpus: max
          memory: max

      - name: install helm
        id: helm
        uses: azure/setup-helm@v4.3.0

      - name: install previous version with helm
        run: |
          helm repo add stakater https://stakater.github.io/stakater-charts --force-update
          helm dependency build .helm/ctrl
          helm install --wait --timeout 10m \
            --set nginx-ingress.enabled=false \
            ctrl oci://australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl:1.0.0

      - name: seed
        run: kubectl exec deployment/backend -- yarn prisma:seed

      - name: upgrade
        run: |
          helm dependency build .helm/ctrl
          helm upgrade --wait --timeout 10m \
            --set nginx-ingress.enabled=false \
            --set userClient.image.tag=${{ github.event.workflow_run.head_sha || github.sha }} \
            --set adminClient.image.tag=${{ github.event.workflow_run.head_sha || github.sha }} \
            --set backend.image.tag=${{ github.event.workflow_run.head_sha || github.sha }} \
            ctrl .helm/ctrl

      - name: debug cluster on failure
        if: failure()
        run: |
          echo "=== POD STATUS ==="
          kubectl get pods -A
          echo "=== POD DESCRIPTIONS ==="
          kubectl describe pods
          echo "=== CLUSTER EVENTS ==="
          kubectl get events --sort-by='.metadata.creationTimestamp'

      - name: test installation
        run: helm test ctrl --logs

      - name: print logs
        if: always()
        run: kubectl logs -l app=USERCLIENT && kubectl logs -l app=BACKEND && kubectl logs -l app=ADMINCLIENT
