name: Security Checks

on:
  push:
    branches: ["dev", "main", "rel*"]
  workflow_dispatch:

jobs:
  security-checks:
    runs-on: ubuntu-latest
    env:
      SNYK_OUTPUT_FILE: snyk_test.json
      POLICY_PATH: .snyk
    steps:
      - uses: actions/checkout@master
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --json-file-output=${{ env.SNYK_OUTPUT_FILE }} --all-projects --severity-threshold=high --policy-path=${{ env.POLICY_PATH }}
      - name: Upload scan as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-json-report
          path: ${{ env.SNYK_OUTPUT_FILE }}
      - name: Generate Snyk Report Summary
        if: always()
        run: bash .github/scripts/snyk-report.sh "${{ env.SNYK_OUTPUT_FILE }}" >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_ACTION_PATH: ${{ github.action_path }}
