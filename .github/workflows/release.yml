name: Release

on:
  push:
    branches:
      - '*'

jobs:
  release:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v0.4.0'
        with:
          workload_identity_provider: 'projects/ctrl-358804/locations/global/workloadIdentityPools/ctrl-next-id-pool/providers/github-provider'
          service_account: 'ctrl-ci-sa@ctrl-358804.iam.gserviceaccount.com'

      - name: Enable Corepack
        run: corepack enable
      - name: Configure Environment
        run: cp ./application/backend/.env.test ./application/backend/.env
      - name: Setup Nodejs and npm
        uses: actions/setup-node@v4
        with:
          node-version: '20.10.0'
          cache: 'yarn'
      - run: yarn install && yarn build
      - name: Check Types
        run: yarn type-check
      - name: Format Code
        run: yarn format
      - name: Lint Code
        run: yarn lint
      - name: Run Unit Testing
        env:
          MAILER_USERNAME: ${{ secrets.TEST_MAILER_USERNAME }}
          MAILER_PASSWORD: ${{ secrets.TEST_MAILER_PASSWORD }}
        run: yarn test
        #run: yarn workspace backend test && yarn workspace user-client test && yarn workspace common test && yarn workspace integrations test && yarn workspace admin-client test
