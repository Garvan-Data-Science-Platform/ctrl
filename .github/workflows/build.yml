name: Release

on:
  #workflow_run: ["Build checks"]
  #  branches: [main]
  #  types:
  #    - completed
  push:
    branches:
      - '*'

jobs:
  release:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v0.4.0'
        with:
          workload_identity_provider: 'projects/ctrl-358804/locations/global/workloadIdentityPools/ctrl-next-id-pool/providers/github-provider'
          service_account: 'ctrl-ci-sa@ctrl-358804.iam.gserviceaccount.com'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@

      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          context: .
          file: application/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl-backend:latest
            australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
