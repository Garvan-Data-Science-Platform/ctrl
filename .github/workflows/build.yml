name: Build and Push

on:
  workflow_run:
    workflows: ['Build checks']
    branches: [main, dev]
    types: [completed]
  push:

jobs:
  build_push:
    name: Build and Push ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: 'read'
      id-token: 'write'
    strategy:
      matrix:
        name: [backend, user-client, admin-client]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/43338454952/locations/global/workloadIdentityPools/ctrl-id-pool/providers/github-provider'
          service_account: 'ctrl-ci-sa@ctrl-358804.iam.gserviceaccount.com'

      - name: Docker auth
        run: gcloud auth configure-docker australia-southeast1-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Parse node version
        id: nvm
        uses: ./.github/actions/parse-node-version

      - name: Check node version
        run: echo "node_version=${{ steps.nvm.outputs.node_version }}"

      - name: Build and Push ${{ matrix.name }} Image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: application/${{ matrix.name }}/Dockerfile
          platforms: 'linux/amd64,linux/arm64'
          push: true
          tags: |
            australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl-${{ matrix.name }}:${{ github.ref_name == 'main' && 'latest' || 'dev' }}
            australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: NODE_VERSION=${{ steps.nvm.outputs.node_version }}

  restart-dev-deployments:
    needs: build_push
    # if: github.ref == 'refs/heads/dev' # Only restart if on dev branch
    uses: Garvan-Data-Science-Platform/helm-deploy-config/.github/workflows/restart-deployments.yml@main
    secrets: inherit
    with:
      environment: dev
