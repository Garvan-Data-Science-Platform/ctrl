name: UAT Tag Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

jobs:
  helm_release:
    name: Build, rename, and push Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: azure/setup-helm@v4.3.0

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/43338454952/locations/global/workloadIdentityPools/ctrl-id-pool/providers/github-provider'
          service_account: ctrl-ci-sa@ctrl-358804.iam.gserviceaccount.com

      - name: Docker auth
        run: gcloud auth configure-docker australia-southeast1-docker.pkg.dev

      - name: Build Helm dependencies
        run: helm repo add jetstack https://charts.jetstack.io --force-update && helm repo add stakater https://stakater.github.io/stakater-charts --force-update && helm dependency build .helm/ctrl

      - name: Get Chart version
        id: chart_version
        run: |
          version=$(grep '^version:' .helm/ctrl/Chart.yaml | awk '{print $2}')
          echo "chart_version=$version" >> $GITHUB_OUTPUT

      - name: Check tag matches chart version
        run: |
          TAG_BASE=$(echo "${GITHUB_REF_NAME}" | sed -E 's/-rc\.[0-9]+$//')
          CHART_VERSION="${{ steps.chart_version.outputs.chart_version }}"
          if [ "$TAG_BASE" != "$CHART_VERSION" ]; then
            echo "Tag base ($TAG_BASE) does not match chart version ($CHART_VERSION)"
            exit 1
          fi

      - name: Package Helm chart
        run: helm package .helm/ctrl

      - name: Rename Helm chart
        run: mv ctrl-*.tgz ctrl-${GITHUB_REF_NAME}.tgz

      - name: Push Helm chart to OCI repo
        run: |
          helm push ctrl-${GITHUB_REF_NAME}.tgz oci://australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public

      - name: Retag Helm chart in Artifact Registry
        env:
          CHART_VERSION: ${{ steps.chart_version.outputs.chart_version }}
        run: |
          gcloud artifacts docker tags add australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl:${CHART_VERSION} australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl:${GITHUB_REF_NAME}
          gcloud artifacts docker tags delete australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl:${CHART_VERSION} --quiet

  docker_retag_push:
    name: Retag Docker images and push
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    needs: helm_release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/43338454952/locations/global/workloadIdentityPools/ctrl-id-pool/providers/github-provider'
          service_account: 'ctrl-ci-sa@ctrl-358804.iam.gserviceaccount.com'

      - name: Docker auth
        run: gcloud auth configure-docker australia-southeast1-docker.pkg.dev

      - name: Get Chart version
        id: chart_version
        run: |
          version=$(grep '^version:' .helm/ctrl/Chart.yaml | awk '{print $2}')
          echo "chart_version=$version" >> $GITHUB_OUTPUT

      - name: Retag and push images
        env:
          CHART_VERSION: ${{ steps.chart_version.outputs.chart_version }}
          SHA: ${{ github.sha }}
        run: |
          for img in backend user-client admin-client; do
            src="australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl-${img}:${SHA}"
            dst="australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl-${img}:${CHART_VERSION}"
            gcloud artifacts docker tags add $src $dst
          done
