name: UAT Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. 1.0.1-rc.1)'
        required: true
        type: string

jobs:
  tag_commit:
    name: Tag commit with release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ github.event.inputs.release_tag }}
          git push origin ${{ github.event.inputs.release_tag }}

  helm_release:
    name: Build, rename, and push Helm chart
    runs-on: ubuntu-latest
    needs: tag_commit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: azure/setup-helm@v4.3.0

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/43338454952/locations/global/workloadIdentityPools/ctrl-id-pool/providers/github-provider'
          service_account: 'ctrl-ci-sa@ctrl-358804.iam.gserviceaccount.com'

      - name: Docker auth
        run: gcloud auth configure-docker australia-southeast1-docker.pkg.dev

      - name: Build Helm dependencies
        run: helm repo add jetstack https://charts.jetstack.io --force-update && helm dependency build .helm/ctrl

      - name: Package Helm chart
        run: helm package .helm/ctrl

      - name: Rename Helm chart
        run: mv ctrl-*.tgz ctrl-${{ github.event.inputs.release_tag }}.tgz

      - name: Push Helm chart to OCI
        run: helm push ctrl-${{ github.event.inputs.release_tag }}.tgz oci://australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public

  docker_retag_push:
    name: Retag Docker images and push
    runs-on: ubuntu-latest
    needs: helm_release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/43338454952/locations/global/workloadIdentityPools/ctrl-id-pool/providers/github-provider'
          service_account: 'ctrl-ci-sa@ctrl-358804.iam.gserviceaccount.com'

      - name: Docker auth
        run: gcloud auth configure-docker australia-southeast1-docker.pkg.dev

      - name: Get Chart version
        id: chart
        run: |
          version=$(cat .helm/ctrl/Chart.yaml | grep '^version' | tr -d 'version: ')
          echo "chart_version=$version" >> $GITHUB_OUTPUT

      - name: Retag and push images
        env:
          CHART_VERSION: ${{ steps.chart.outputs.chart_version }}
          SHA: ${{ github.sha }}
        run: |
          for img in backend user-client admin-client; do
            src="australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl-${img}:${SHA}"
            dst="australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl-${img}:${CHART_VERSION}"
            docker pull $src
            docker tag $src $dst
            docker push $dst
          done
