controller:
  ingressClass: nginx
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  metrics:
    enabled: true
    service:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '10254'
  config:
    ssl-redirect: 'false'
    use-forwarded-headers: 'true'
    compute-full-forwarded-for: 'true'
    use-proxy-protocol: 'false'
    enable-real-ip: 'true'
    proxy-body-size: '50m'

defaultBackend:
  enabled: true
  replicaCount: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

admissionWebhooks:
  enabled: true
  patch:
    enabled: true
