controller:
  ingressClass: nginx
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  metrics:
    enabled: true
  config:
    ssl-redirect: 'false'
    use-forwarded-headers: 'true'

defaultBackend:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
