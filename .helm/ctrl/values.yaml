# Default values for ctrl.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

demoMode:
  enabled: false

config:
  oidc: []
    #- name:
    #  providerUrl:
    #  clientId:
    #  clientSecret:
    #  icon: #A link to png for login button

  disableAdminPasswordLogin: false
  otp: true
  inviteExpiryDays: 7
  # Mail provider. Supported: 'smtp-basic' (any SMTP server with username/password auth), 'm365-oauth' (Microsoft 365 OAuth 2 SMTP via MSAL).
  # See docs/email.md for the deployer guide.
  mailer:
    provider: smtp-basic
    host: ''
    port: 587
    username: ''
    password: ''
    sender: ''
    # For m365-oauth, set provider to m365-oauth in your own values file and add:
    #   tenantId: '<garvan-tenant-id>'
    #   clientId: '<entra-app-client-id>'
    #   clientSecret: '<entra-app-client-secret>'
    #   host: smtp.office365.com
    #   port: 587
    #   sender: 'CTRL <ctrl-noreply@garvan.org.au>'
    # Leave username and password as empty strings, they are ignored on this path.

userClient:
  hostname: ctrlhost
  image:
    repository: australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl-user-client
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: #

adminClient:
  hostname: ctrladmin
  image:
    repository: australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl-admin-client
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: #

backend:
  image:
    repository: australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl-backend
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: #

ingress:
  enabled: false
  className: 'nginx'
  annotations:
    nginx.org/rewrites: 'serviceName=backend rewrite=/'
    #ingress.kubernetes.io/ssl-redirect: 'false'
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  tls: []
  hosts:
    userClient:
      host: ctrlhost
      paths:
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: backend
              port:
                number: 80
        - path: /
          pathType: Prefix
          backend:
            service:
              name: user-client
              port:
                number: 80

    adminClient:
      host: ctrladmin
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: admin-client
              port:
                number: 80
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: backend
              port:
                number: 80

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

postgresql:
  image:
    repository: postgres
    tag: 17.5
  primary:
    containerSecurityContext:
      readOnlyRootFilesystem: false
  global:
    security:
      allowInsecureImages: true
  fullnameOverride: ctrl-postgres
  auth:
    existingSecret: ctrl-postgres

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: NodePort
  port: 80

tls: []
#  - secretName: chart-example-tls
#    hosts:
#      - chart-example.local

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
