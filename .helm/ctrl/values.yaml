# Default values for ctrl.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

demoMode:
  enabled: false

auth:
  admin: #Default admin credentials
    email:
    password:

userClient:
  image:
    repository: australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl-user-client
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: 'latest'

adminClient:
  image:
    repository: australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl-admin-client
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: 'latest'

backend:
  image:
    repository: australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl-backend
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: 'latest'

nginx-ingress:
  enabled: true

mailer:
  host:
  port:
  username:
  password:

ingress:
  enabled: true
  className: 'nginx'
  annotations:
    { nginx.org/rewrites: 'serviceName=backend rewrite=/' }
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    userClient:
      hostname: ctrlhost
      paths:
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: backend
              port:
                number: 80
        - path: /
          pathType: Prefix
          backend:
            service:
              name: ctrl
              port:
                number: 80

    adminClient:
      hostname: ctrladmin
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: admin
              port:
                number: 80
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: backend
              port:
                number: 80

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

postgresql:
  auth:
    database: ctrl

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations: {}
podLabels: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: NodePort
  port: 80

tls: []
#  - secretName: chart-example-tls
#    hosts:
#      - chart-example.local

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
