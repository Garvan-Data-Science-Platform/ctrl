apiVersion: v2
name: ctrl
description: A Helm chart for Kubernetes

type: application

dependencies:
  - name: nginx-ingress
    repository: oci://ghcr.io/nginx/charts
    version: 2.0.0
    condition: nginx-ingress.enabled
  - name: postgresql
    repository: oci://registry-1.docker.io/bitnamicharts
    version: 16.3.0
