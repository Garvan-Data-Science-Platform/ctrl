apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ctrl.fullname" . }}-test-connection"
  labels:
    {{- include "ctrl.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['sh','-c']
      args: ['wget --no-cache --spider ctrl && wget --no-cache --spider admin && wget --no-cache --spider --timeout=1 --tries 20 backend']
  restartPolicy: Never
