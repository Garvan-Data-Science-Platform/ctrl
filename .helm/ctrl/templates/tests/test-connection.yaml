apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ctrl.fullname" . }}-test-connection"
  labels:
    {{- include "ctrl.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: alpine/curl
      command: ['sh','-c']
      args: ['curl --retry 5 user-client && curl --retry 5 admin-client && curl --retry 5 backend']
  restartPolicy: Never
