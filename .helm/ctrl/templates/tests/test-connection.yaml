apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ctrl.fullname" . }}-test-connection"
  labels:
    {{- include "ctrl.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['sh','-c']
      args: ['wget --no-cache --spider ctrl && wget --no-cache --spider admin && for i in 1 2 3 4 5; do wget backend && break || sleep 5; done']
  restartPolicy: Never
