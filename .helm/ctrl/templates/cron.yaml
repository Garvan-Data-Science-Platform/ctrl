{{- if .Values.demoMode.enabled }}

apiVersion: batch/v1
kind: CronJob
metadata:
  name: demo-reset
spec:
  timeZone: "Australia/Sydney"
  schedule: "0 0 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: cron-backend
            image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.Version }}"
            imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
            env:
              - name: POSTGRES_HOST
                value: ctrl-postgres
              - name: HOSTNAME
              {{ with .Values.ingress.hosts.userClient }}
                value: {{ .hostname | quote }}
              {{ end }}
              - name: EXAMPLE_ORG_ADMIN_EMAIL
                value: admin@example.com
              - name: EXAMPLE_ORG_ADMIN_PASSWORD
                value: Supersecret123
              - name: EXAMPLE_PARTICIPANT_EMAIL
                value: user@example.com
              - name: EXAMPLE_PARTICIPANT_PASSWORD
                value: Supersecret123
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ctrl-postgres
                    key: postgres-password
              - name: PRISMA_FIELD_ENCRYPTION_KEY
                valueFrom:
                  secretKeyRef:
                    name: aeskey
                    key: aeskey
              - name: EMAIL_HASH_SALT
                valueFrom:
                  secretKeyRef:
                    name: hash-salts
                    key: email-hash-salt
              - name: FIRST_NAME_HASH_SALT
                valueFrom:
                  secretKeyRef:
                    name: hash-salts
                    key: first-name-hash-salt
              - name: LAST_NAME_HASH_SALT
                valueFrom:
                  secretKeyRef:
                    name: hash-salts
                    key: last-name-hash-salt
              - name: DOB_HASH_SALT
                valueFrom:
                  secretKeyRef:
                    name: hash-salts
                    key: dob-hash-salt
            command:
            - /bin/sh
            - -c
            - date; yarn prisma:wipe && yarn prisma:seed
          restartPolicy: OnFailure

{{- end }}
