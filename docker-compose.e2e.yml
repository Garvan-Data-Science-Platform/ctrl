services:
  db-test:
    image: postgres:16-alpine
    ports:
      - '5433:5433'
    env_file:
      - ./application/backend/.env.test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -p 5433']
      interval: 1s
      timeout: 1s
      retries: 60
    command: ['postgres', '-c', 'log_statement=all', '-p', '5433']

  mailhog:
    image: mailhog/mailhog
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8025']
      interval: 2s
      timeout: 2s
      retries: 10

  backend:
    image: australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl-backend:${IMAGE_TAG}
    depends_on:
      db-test:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    env_file:
      - ./application/backend/.env.dockertest
    environment:
      - NODE_ENV=e2e
    volumes:
      - ./application/common/e2e-tests/config.e2e.json5:/app/config/config.json5
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5001/
      interval: 5s
      timeout: 2s
      retries: 10
    ports:
      - '5001:5001'

  user-client:
    image: australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl-user-client:${IMAGE_TAG}
    ports:
      - '5002:80'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80']
      interval: 2s
      timeout: 2s
      retries: 10

  admin-client:
    image: australia-southeast1-docker.pkg.dev/dsp-registry-410602/garvan-public/ctrl-admin-client:${IMAGE_TAG}
    ports:
      - '5003:80'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80']
      interval: 2s
      timeout: 2s
      retries: 10
